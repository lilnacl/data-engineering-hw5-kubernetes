apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: rustfs-disk1, namespace: hw5}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: rustfs-disk2, namespace: hw5}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: rustfs-disk3, namespace: hw5}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: rustfs-disk4, namespace: hw5}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rustfs, namespace: hw5}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: rustfs}}
  template:
    metadata: {labels: {app: rustfs}}
    spec:
      priorityClassName: hw5-high
      securityContext: {fsGroup: 10001}
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
          command: [/usr/bin/rustfs]
          args: [server, --address, '0.0.0.0:9000', --console-enable, --console-address, '0.0.0.0:9001', /data1, /data2, /data3, /data4]
          ports:
            - {name: s3, containerPort: 9000}
            - {name: console, containerPort: 9001}
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: access}}
            - name: RUSTFS_SECRET_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: secret}}
            - {name: RUSTFS_STORAGE_CLASS_STANDARD, value: 'EC:2'}
            - {name: RUSTFS_ERASURE_SET_DRIVE_COUNT, value: '4'}
            - {name: RUSTFS_UNSAFE_BYPASS_DISK_CHECK, value: 'true'}
            - {name: RUSTFS_OBS_LOG_DIRECTORY, value: /tmp/logs}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
          readinessProbe: {tcpSocket: {port: s3}, initialDelaySeconds: 5, periodSeconds: 2}
          volumeMounts:
            - {name: disk1, mountPath: /data1}
            - {name: disk2, mountPath: /data2}
            - {name: disk3, mountPath: /data3}
            - {name: disk4, mountPath: /data4}
      volumes:
        - {name: disk1, persistentVolumeClaim: {claimName: rustfs-disk1}}
        - {name: disk2, persistentVolumeClaim: {claimName: rustfs-disk2}}
        - {name: disk3, persistentVolumeClaim: {claimName: rustfs-disk3}}
        - {name: disk4, persistentVolumeClaim: {claimName: rustfs-disk4}}
---
apiVersion: v1
kind: Service
metadata: {name: rustfs, namespace: hw5}
spec:
  selector: {app: rustfs}
  ports:
    - {name: s3, port: 9000, targetPort: s3}
    - {name: console, port: 9001, targetPort: console}
