apiVersion: v1
kind: Pod
metadata:
  name: cpu-reservation
  namespace: hw5
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  containers:
  - name: reservation
    image: de-hw5-skills:1
    imagePullPolicy: Never
    command:
    - python
    - -c
    - import time; print("CPU request reserved", flush=True); time.sleep(600)
    resources:
      requests:
        cpu: 9800m
        memory: 64Mi
      limits:
        cpu: 9800m
        memory: 128Mi
  priorityClassName: hw5-high
