apiVersion: batch/v1
kind: Job
metadata:
  name: skills-reducer
  namespace: hw5
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: skills
        image: de-hw5-skills:1
        imagePullPolicy: Never
        args:
        - --prefix
        - runs/parallel
        - --mode
        - reduce
        - --parts
        - '4'
        resources:
          requests:
            cpu: 250m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 112Mi
        env:
        - name: S3_ENDPOINT
          value: http://rustfs.hw5.svc.cluster.local:9000
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: access
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: secret
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: baseline
          mountPath: /baseline
          readOnly: true
      volumes:
      - name: baseline
        configMap:
          name: hw3-baseline
