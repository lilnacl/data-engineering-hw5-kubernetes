apiVersion: v1
kind: Namespace
metadata: {name: hw5-ui}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: viewer, namespace: hw5-ui}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: hw5-ui-readonly}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, persistentvolumeclaims, persistentvolumes, nodes, namespaces, resourcequotas, events, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: hw5-ui-readonly}
subjects:
  - {kind: ServiceAccount, name: viewer, namespace: hw5-ui}
roleRef: {kind: ClusterRole, name: hw5-ui-readonly, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: headlamp, namespace: hw5-ui}
spec:
  replicas: 1
  selector: {matchLabels: {app: headlamp}}
  template:
    metadata: {labels: {app: headlamp}}
    spec:
      priorityClassName: hw5-high
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.46.0
          args: [-in-cluster, -plugins-dir=/headlamp/plugins]
          ports: [{containerPort: 4466}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: headlamp, namespace: hw5-ui}
spec:
  selector: {app: headlamp}
  ports: [{port: 4466, targetPort: 4466}]
